# Archives the Sundial scheme (the iOS app, its widgets, and the Apple Watch app with its
# complications), signs it for the App Store and uploads it to App Store Connect, where it appears
# in TestFlight after processing. Runs on a `v*` tag or by hand (Actions → TestFlight → Run
# workflow). No Mac is needed: signing is automatic ("cloud signing") through an App Store Connect
# API key, so no certificate or profile is stored anywhere.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       the API key's Key ID
#   ASC_ISSUER_ID    the Issuer ID shown above the keys list
#   ASC_KEY_P8       the whole contents of the downloaded AuthKey_<KEY_ID>.p8 file
#   APPLE_TEAM_ID    the ten-character Team ID (not secret; a variable works too)
# The key is a Team Key (Users and Access → Integrations → App Store Connect API) with the Admin
# role, or App Manager with access to Certificates, Identifiers & Profiles, so that Xcode can
# create the distribution certificate and profiles. See docs/RELEASE.md §10.
#
# The build number is this workflow's run number, so every upload is higher than the last. The
# version (MARKETING_VERSION) comes from Apps/project.yml.
name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PROJECT: Apps/Sundial.xcodeproj
  ARCHIVE: build/Sundial.xcarchive
  MINIMUM_XCODE_MAJOR: "27"

jobs:
  upload:
    name: Archive and upload to App Store Connect
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the header of this workflow)"
            exit 1
          fi

      - name: Verify release tag matches the app version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version=$(sed -n 's/^[[:space:]]*MARKETING_VERSION: "\([0-9][0-9.]*\)"/\1/p' Apps/project.yml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"
            exit 1
          fi

      - name: Select the newest released Xcode
        run: |
          # Release builds must come from a released Xcode, never a beta.
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "::error::No released Xcode on this runner"; exit 1; fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')
          if [ -z "$major" ] || [ "$major" -lt "$MINIMUM_XCODE_MAJOR" ]; then
            echo "::error::Sundial needs Xcode $MINIMUM_XCODE_MAJOR or newer; this runner's newest released one is $(xcodebuild -version | head -1)"
            exit 1
          fi
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Install the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme Sundial -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties' "$ARCHIVE/Info.plist"

      - name: Sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$ARCHIVE/Info.plist")
          echo "Uploaded Sundial $version ($GITHUB_RUN_NUMBER). It appears in TestFlight once App Store Connect has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: ${{ always() }}
        run: rm -f "${ASC_KEY_PATH:-/nonexistent}"

      - name: Keep the archive's logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: |
            ~/Library/Logs/DiagnosticReports
            build/export/*.log
          if-no-files-found: ignore
          retention-days: 7
